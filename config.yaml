# SSP Production Configuration File

# --- AI & Vision Settings ---
ai:
  # Path to the trained YOLO model
  model_path: "SSP_Fuel_lid_V5.pt"
  
  # Confidence threshold for detecting the OCR target regions (serial, back, etc.)
  ocr_confidence_threshold: 0.10
  
  # Fallback timeout (in seconds) before attempting to read the back panel if serial is missing
  ocr_fallback_timeout: 3.5
  
  # Per-class YOLO confidence thresholds. 
  class_confidences:
    # Standard Classes
    front: 0.70
    back: 0.85
    serial: 0.10
    serial_area: 0.10
    circle_front: 0.75
    circle_back: 0.75
    holes: 0.50
    
    # Defect Classes
    dent: 0.40
    bulge: 0.50
    damage: 0.85
    line_mark: 0.50
    flange_cut: 0.50
    forming_damage: 0.50
    hole_missing: 0.50
    hole_spec_error: 0.50
    leg_bend: 0.50
    scrap_mark: 0.50
    flange_bend: 0.50

  # Default YOLO confidence threshold if a class is not specified above
  default_yolo_confidence: 0.25
  
  # Minimum bounding box area (in pixels) for a defect to be considered valid
  min_defect_area: 200

  # Post-processing thresholds to filter out empty blue foam trays
  part_presence:
    blue_thresh: 0.75
    metal_min_ratio: 0.15
    laplacian_variance_min: 150.0

# --- Data Management ---
storage:
  # Number of days to keep old inspection reports and images before auto-deleting them
  retention_days: 30

# --- Web Server ---
web:
  host: "0.0.0.0"
  port: 5000

# --- Default Camera Connection Settings (Optional) ---
camera:
  gige:
    pixel_format: "BayerRG8"
    exposure: 60000.0
    gain: 1.0
  rtsp:
    url: ""
