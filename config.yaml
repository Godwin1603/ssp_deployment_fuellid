
ai:
  class_confidences:
    # --- Panel classes ---
    back: 0.85
    cricle_back: 0.75      # model class ID 3 (note: typo in model)
    circle_front: 0.75     # model class ID 2
    front: 0.80
    # --- Hole / structural ---
    holes: 0.40
    hole_missing: 0.60
    hole_spec_error: 0.90 
    # --- Defect classes ---
    bulge: 0.50
    damage: 0.40
    dent: 0.70
    flange_bend: 0.60
    flange_cut: 0.40
    forming_damage: 0.60
    leg_bend: 0.40
    line_mark: 0.40
    scrap_mark: 0.40
    # --- OCR classes ---
    serial: 0.10
    serial_area: 0.10
  default_yolo_confidence: 0.10
  min_defect_area: 200
  defect_merge_distance: 50
  model_path: best.pt
  ocr_confidence_threshold: 0.1
  ocr_fallback_timeout: 3.5
  part_presence:
    blue_thresh: 0.75
    laplacian_variance_min: 150.0
    metal_min_ratio: 0.15
camera:
  gige:
    exposure: 60000.0
    gain: 1.0
    pixel_format: BayerRG8
  rtsp:
    url: ''

storage:
  retention_days: 30
web:
  host: 0.0.0.0
  port: 5000
roi:   # Full frame - covers entire camera feed (null = auto full-frame with 10px margin)
