ai:
  class_confidences:
    # --- Panel classes ---
    back: 0.60
    circle_back: 0.40
    cricle_back: 0.40      # model class ID typo in model
    circle_front: 0.80
    cricle_front: 0.40     # typo alias
    front: 0.40
    polygen_back: 0.40
    polygen_front: 0.60
    polygon_back: 0.40
    polygon_front: 0.40
    # --- Hole / structural ---
    holes: 0.40
    hole_missing: 0.50
    hole_spec_error: 0.90
    # --- Defect classes ---
    bulge: 0.10
    damage: 0.10
    dent: 0.10
    flange_bend: 0.60
    flange_cut: 0.55
    forming_damage: 0.60
    leg_bend: 0.55
    line_mark: 0.55
    scrap_mark: 0.10
    catchplug_bend: 0.45
    catchplug_wide: 0.45
    # --- Rectangle SU2I/BN7I Gauge features ---
    catch_plug: 0.35
    lwd: 0.35
    lwb: 0.35
    su2i: 0.35
    wide: 0.35
    # --- OCR classes ---
    serial: 0.10
    serial_area: 0.10
  default_yolo_confidence: 0.06
  imgsz: 1024
  min_defect_area: 250
  max_defect_plate_ratio: 0.50
  defect_merge_distance: 50
  models:
    circle: "SSP_Circle_4D_5D_model.pt"
    polygen: "SSP_polygen_model.pt"
    rectangle: "SSP_SU2I_BN7I_FuelDoor_model.pt"
  ocr_confidence_threshold: 0.1
  ocr_fallback_timeout: 3.5
  gauge:
    history_window: 7
    deadband_mm: 0.05
    smoothing_factor: 0.35
    plug_settle_sec: 0.8
    plug_fail_min_frames: 5
    plug_fail_min_sec: 1.5
  part_presence:
    blue_thresh: 0.75
    laplacian_variance_min: 150.0
    metal_min_ratio: 0.15
  roi_side_tolerance_pct: 1.1
camera:
  gige:
    exposure: 60000.0
    gain: 1.0
    pixel_format: "BayerRG8"
  rtsp:
    url: ''

storage:
  retention_days: 30
web:
  host: 0.0.0.0
  port: 5000
roi:   # Full frame - covers entire camera feed (null = auto full-frame with 10px margin)
